worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/plain application/javascript application/json text/css;

  # Increase for video uploads (adjust to your largest expected file)
  client_max_body_size 8G;
  proxy_read_timeout   3600s;
  proxy_send_timeout   3600s;

  upstream api    { server api:3000; }
  upstream client { server client:80; }
  upstream admin  { server admin:80; }

  server {
    listen 80;
    server_name _;

    # API
    location /api/ {
      proxy_pass         http://api/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection keep-alive;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering    off;
    }

    # HLS video streams (served directly from volume)
    location /hls/ {
      alias /var/hls/;
      add_header Cache-Control "public, max-age=3600";
      add_header Access-Control-Allow-Origin "*";
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
    }

    # Thumbnails
    location /thumbnails/ {
      alias /var/thumbnails/;
      add_header Cache-Control "public, max-age=86400";
      expires 1d;
    }

    # Admin UI (served at /admin)
    location /admin {
      proxy_pass http://admin;
      proxy_set_header Host $host;
      try_files $uri $uri/ /index.html;
    }

    # Client portal (root)
    location / {
      proxy_pass http://client;
      proxy_set_header Host $host;
    }
  }

  # Uncomment and configure for HTTPS:
  # server {
  #   listen 443 ssl http2;
  #   server_name yourdomain.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   # ... same location blocks as above
  # }
}
